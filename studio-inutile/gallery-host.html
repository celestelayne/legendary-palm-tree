<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Software Inutile — Studio Pin-Up & Host Harness</title>
  <style>
    :root {
      --bg: #ecebe6;
      --surface: #f7f6f2;
      --ink: #181818;
      --muted: #6e6d68;
      --border: #d5d3cb;
      --accent: #d9381e; /* Munari vermilion */
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* --- LAYOUT: GALLERY WALL (LEFT) + CONVERSATIONAL HOST (RIGHT) --- */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
    }

    /* --- LEFT: PIN-UP GALLERY WALL --- */
    .gallery-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .topbar h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button:hover { border-color: var(--ink); }
    button.primary {
      background: var(--ink);
      color: var(--surface);
      border-color: var(--ink);
    }
    button.primary:hover { background: var(--accent); border-color: var(--accent); }

    .wall {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      align-content: start;
    }

    /* --- INDIVIDUAL APPLET FRAME --- */
    .plinth {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }
    .plinth.active-target { border-color: var(--accent); }

    .plinth-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .plinth-title {
      font-size: 13px;
      font-weight: 600;
    }

    .plinth-author {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .viewport-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      background: #f4f3ef;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .plinth-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .caption {
      color: var(--muted);
      line-height: 1.4;
    }

    .telemetry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink);
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #999;
      margin-right: 5px;
    }
    .status-dot.still { background: #6e6d68; }
    .status-dot.drifting { background: #2b7a78; }
    .status-dot.turbulent { background: var(--accent); }

    /* --- RIGHT: SIMULATED CONVERSATIONAL HOST --- */
    .chat-pane {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      height: 100vh;
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .chat-header h2 {
      font-size: 12px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chat-header p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .draft-presets {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f1f0eb;
    }
    .preset-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    .msg {
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .msg.system {
      background: transparent;
      border-style: dashed;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
    }
    .msg-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .chat-input-box {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .target-select {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px;
      background: #fff;
      border: 1px solid var(--border);
      width: 100%;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      font-family: var(--sans);
      font-size: 12px;
      background: #fff;
    }
    input[type="text"]:focus { outline: 1px solid var(--ink); }
  </style>
</head>
<body>

<div class="workspace">
  <!-- LEFT: STUDIO PIN-UP WALL -->
  <section class="gallery-pane">
    <header class="topbar">
      <h1>Macchine Inutili — Studio Pin-Up Wall</h1>
      <div class="topbar-controls">
        <button id="btn-discover" title="Scan ./submissions/ directory index">↻ Rescan ./submissions/</button>
        <button id="btn-add-folder">+ Load Folder</button>
        <button id="btn-demo" class="primary">+ Spawn Reference Applet</button>
      </div>
    </header>

    <main class="wall" id="wall"></main>
  </section>

  <!-- RIGHT: CONVERSATIONAL HOST & POSTMESSAGE BRIDGE -->
  <aside class="chat-pane">
    <div class="chat-header">
      <h2>Conversational Host Simulator</h2>
      <p>Translates chat cadence & prompts into <code>applet:action</code> drafts.</p>
    </div>

    <div class="draft-presets">
      <span class="preset-label">Inject Ambient Draft (postMessage)</span>
      <div class="preset-row">
        <button onclick="sendDraft(0.25, 'cool')">Gentle Breeze (+0.25)</button>
        <button onclick="sendDraft(-0.9, 'warm')">Sudden Gust (-0.90)</button>
        <button onclick="sendDraft(0.05, 'humid')">Humid Stillness</button>
      </div>
    </div>

    <div class="chat-log" id="chat-log">
      <div class="msg system">
        Host ready. Listening for <code>applet:state</code> emissions from embedded iframes...
      </div>
    </div>

    <form class="chat-input-box" id="chat-form">
      <select class="target-select" id="target-select">
        <option value="*">Broadcast to All Applets (*)</option>
      </select>
      <div class="input-row">
        <input type="text" id="chat-input" placeholder="Type a prompt to generate a conversational draft..." autocomplete="off" />
        <button type="submit" class="primary">Send</button>
      </div>
    </form>
  </aside>
</div>

<script>
    console.log('this works...')
  const wall = document.getElementById('wall');
  const chatLog = document.getElementById('chat-log');
  const targetSelect = document.getElementById('target-select');
  const loadedSlugs = new Set();

  // --- 1. LOGGING & TELEMETRY ---
  function appendLog(meta, text, isSystem = false) {
    const div = document.createElement('div');
    div.className = isSystem ? 'msg system' : 'msg';
    div.innerHTML = meta ? `<div class="msg-meta">${meta}</div><div>${text}</div>` : text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // Listen for passive state updates emitted by student applets
  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || msg.type !== 'applet:state') return;

    // Match which iframe sent the message
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach((frame) => {
      if (frame.contentWindow === event.source) {
        const plinth = frame.closest('.plinth');
        const dot = plinth.querySelector('.status-dot');
        const readout = plinth.querySelector('.state-readout');
        const { agitationLevel = 'still', idleSeconds = 0, angleRadians = 0 } = msg.state || {};

        dot.className = `status-dot ${agitationLevel}`;
        readout.textContent = `${agitationLevel} · idle ${idleSeconds}s · θ ${angleRadians}`;
      }
    });
  });

  // --- 2. MOUNT AN APPLET ONTO THE PIN-UP WALL ---
  async function mountStudentFolder(slug) {
    if (loadedSlugs.has(slug)) return;
    loadedSlugs.add(slug);

    let manifest = {
      applet: { name: slug, author: slug, description: 'No applet.manifest.json found.' }
    };

    try {
      const res = await fetch(`./submissions/${slug}/applet.manifest.json`);
      if (res.ok) manifest = await res.json();
    } catch (error) {
      // Use the fallback manifest when the student manifest is unavailable.
    }

    const title = manifest.applet?.name || slug;
    const author = manifest.applet?.author || slug;
    const desc = manifest.applet?.description || '';
    const entry = manifest.applet?.entrypoint || 'index.html';

    createPlinth({
      id: slug,
      title,
      author,
      desc,
      src: `./submissions/${slug}/${entry}`
    });
  }

  function createPlinth({ id, title, author, desc, src, srcdoc }) {
    const article = document.createElement('article');
    article.className = 'plinth';
    article.dataset.appletSlug = id;
    article.innerHTML = `
      <div class="plinth-header">
        <span class="plinth-title">${title}</span>
        <span class="plinth-author">@${author}</span>
      </div>
      <div class="viewport-wrap">
        <iframe sandbox="allow-scripts allow-same-origin" title="${title}"></iframe>
      </div>
      <div class="plinth-footer">
        <div class="caption">${desc}</div>
        <div class="telemetry">
          <span>
            <i class="status-dot still"></i>
            <span class="state-readout">awaiting state...</span>
          </span>
          <button onclick="sendDraft(0.5, 'warm', '${id}')">Nudge</button>
        </div>
      </div>
    `;

    const iframe = article.querySelector('iframe');
    if (srcdoc) iframe.srcdoc = srcdoc;
    else iframe.src = src;

    wall.appendChild(article);

    // Add to host target dropdown.
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = `Target: ${title} (@${author})`;
    targetSelect.appendChild(opt);
  }

  // --- 3. AUTO-DISCOVER ./submissions/ FOLDERS (Works with python -m http.server) ---
  async function scanSubmissionsDirectory() {
    try {
      const res = await fetch('./submissions/');
      if (!res.ok) throw new Error('Directory listing unavailable');

      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const links = Array.from(doc.querySelectorAll('a'))
        .map((anchor) => anchor.getAttribute('href'))
        .filter(
          (href) =>
            href &&
            href.endsWith('/') &&
            !href.startsWith('.') &&
            !href.startsWith('/')
        );

      if (links.length === 0) {
        appendLog(
          'HOST SCAN',
          'Found ./submissions/ folder, but no student subfolders yet.',
          true
        );
        return;
      }

      links.forEach((folder) => mountStudentFolder(folder.replace(/\/$/, '')));
      appendLog(
        'HOST SCAN',
        `Mounted ${links.length} student applet(s) from ./submissions/.`,
        true
      );
    } catch (error) {
      appendLog(
        'HOST NOTICE',
        'Run via local server (e.g., python3 -m http.server) to auto-scan ./submissions/, or click "Spawn Reference Applet".',
        true
      );
    }
  }

  // --- 4. SEND POSTMESSAGE DRAFTS FROM HOST TO APPLETS ---
  function sendDraft(impulse, temperature, specificTarget = null) {
    const target = specificTarget || targetSelect.value;
    const payload = {
      type: 'applet:action',
      action: 'disturb_air',
      params: { impulse: Number(impulse.toFixed(2)), temperature }
    };
    let count = 0;

    document.querySelectorAll('.plinth').forEach((plinth) => {
      const slug = plinth.dataset.appletSlug;
      if (target === '*' || target === slug) {
        const iframe = plinth.querySelector('iframe');
        iframe.contentWindow.postMessage(payload, '*');
        count++;
      }
    });

    appendLog(
      'POSTMESSAGE → ' + (target === '*' ? `ALL (${count})` : target),
      `<code>disturb_air</code> { impulse: ${payload.params.impulse}, temperature: "${temperature}" }`,
      true
    );
  }

  // Convert conversational text input into physical air current parameters.
  document.getElementById('chat-form').addEventListener('submit', (event) => {
    event.preventDefault();

    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    appendLog('CRITIQUE PROMPT', text);
    input.value = '';

    // Derive wind impulse and air viscosity from message length, punctuation, and tone.
    const direction = text.includes('?') ? -1 : 1;
    const magnitude =
      Math.min(text.length / 60, 1.0) * (text.includes('!') ? 1.0 : 0.45);
    const impulse = direction * Math.max(magnitude, 0.15);
    const temperature =
      text.length > 80 ? 'humid' : text.includes('!') ? 'warm' : 'cool';

    sendDraft(impulse, temperature);
  });

  // Manual folder prompt.
  document.getElementById('btn-add-folder').addEventListener('click', () => {
    const slug = prompt(
      'Enter student folder name inside ./submissions/ (e.g., "alice"): '
    );
    if (slug && slug.trim()) mountStudentFolder(slug.trim());
  });

  document
    .getElementById('btn-discover')
    .addEventListener('click', scanSubmissionsDirectory);

  // Built-in reference applet so the wall works immediately even with an empty folder.
  let demoCount = 0;
  document.getElementById('btn-demo').addEventListener('click', () => {
    demoCount++;
    const id = `reference-${demoCount}`;
    const srcdoc = `<!DOCTYPE html>
<html>
  <head>
    <style>
      * { margin: 0; padding: 0; }
      body { background: #f4f3ef; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById('c');
      const context = canvas.getContext('2d');
      let width;
      let height;
      let angle = (Math.random() - 0.5) * 0.5;
      let velocity = 0;
      let draft = 0;
      let damping = 0.97;
      let idle = 0;
      let frame = 0;

      const resize = () => {
        width = canvas.width = innerWidth;
        height = canvas.height = innerHeight;
      };

      onresize = resize;
      resize();

      onmousemove = (event) => {
        velocity += (event.movementX || 0) * 0.0004;
        idle = 0;
      };

      onmessage = (event) => {
        if (event.data?.action === 'disturb_air') {
          draft += (event.data.params.impulse || 0) * 0.08;
          damping = event.data.params.temperature === 'humid' ? 0.92 : 0.975;
        }
      };

      (function loop() {
        context.clearRect(0, 0, width, height);
        idle++;
        draft *= 0.85;
        velocity += draft - Math.sin(angle) * 0.005;
        velocity *= damping;
        angle += velocity;

        const anchorX = width / 2;
        const anchorY = height * 0.2;
        const length = Math.min(width, height) * 0.34;
        const targetX = anchorX + Math.sin(angle) * length;
        const targetY = anchorY + Math.cos(angle) * length;

        context.strokeStyle = 'rgba(0, 0, 0, 0.08)';
        context.beginPath();
        context.moveTo(anchorX + 18, anchorY + 22);
        context.lineTo(targetX + 18, targetY + 22);
        context.stroke();

        context.strokeStyle = '#999';
        context.beginPath();
        context.moveTo(anchorX, 0);
        context.lineTo(anchorX, anchorY);
        context.stroke();

        context.strokeStyle = '#181818';
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(anchorX, anchorY);
        context.lineTo(targetX, targetY);
        context.stroke();

        context.fillStyle = '#d9381e';
        context.beginPath();
        context.arc(targetX, targetY, 14 + Math.min(idle * 0.02, 18), 0, 7);
        context.fill();

        if (++frame % 60 === 0) {
          parent.postMessage(
            {
              type: 'applet:state',
              state: {
                angleRadians: +angle.toFixed(3),
                agitationLevel:
                  Math.abs(velocity) < 0.002
                    ? 'still'
                    : Math.abs(velocity) < 0.02
                      ? 'drifting'
                      : 'turbulent',
                idleSeconds: Math.floor(idle / 60)
              }
            },
            '*'
          );
        }

        requestAnimationFrame(loop);
      })();
    <\/script>
  </body>
</html>`;

    createPlinth({
      id,
      title: `Suspended Spar #${demoCount}`,
      author: 'munari-study',
      desc: 'Translates conversational prompt length and punctuation into directional air currents.',
      srcdoc
    });
  });

  // Initial scan on load.
  scanSubmissionsDirectory();
</script>
</body>
</html>
